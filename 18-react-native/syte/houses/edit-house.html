<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Clover - Editar Escuadra</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <main class="mobile-stage">
        <section class="houses-inner-view app-view is-active">

            <button class="menu-trigger char-menu-trigger" type="button" aria-label="Abrir menu" aria-expanded="false">
                <img class="clover-logo" src="../img/clover-logo.svg" alt="">
            </button>

            <div class="char-avatar-wrap">
                <div class="char-avatar char-avatar-edit" onclick="document.getElementById('ehAvatarInput').click()">
                    <img id="ehAvatar" src="../img/house-turret.svg" alt="House">
                </div>
                <div class="char-avatar-pencil" onclick="document.getElementById('ehAvatarInput').click()">
                    <img src="../img/pencil.svg" alt="editar">
                </div>
                <input type="file" id="ehAvatarInput" accept="image/*" style="display:none">
            </div>

            <h1 class="char-title" id="ehName">—</h1>

            <form class="ec-form" id="ehForm">
                <div class="ec-field">
                    <label class="ec-label">NAME</label>
                    <input class="ec-input ec-input--disabled" id="ehInputName" type="text" disabled>
                </div>
                <div class="ec-field">
                    <label class="ec-label">REGION</label>
                    <input class="ec-input" id="ehInputRegion" type="text">
                </div>
                <div class="ec-field">
                    <label class="ec-label">CAPTAIN</label>
                    <input class="ec-input" id="ehInputCaptain" type="text">
                </div>

                <div class="ec-actions">
                    <button class="vc-back-btn" type="button" onclick="history.back()">&#8592; BACK</button>
                    <button class="ec-save-btn" type="submit">SAVE ✓</button>
                </div>
            </form>

        </section>

        <button class="menu-backdrop" type="button" aria-label="Cerrar menu"></button>

        <aside class="side-menu side-menu--dashboard" aria-hidden="true">
            <nav class="side-menu-nav side-menu-nav--dashboard" aria-label="Menu principal">
                <a href="../dashboard.html" class="side-menu-item">
                    <span>DASHBOARD</span>
                    <img src="../img/clover-logo.svg" alt="">
                </a>
                <a href="../profile.html" class="side-menu-item">
                    <span>MY PROFILE</span>
                    <img src="../img/profile.svg" alt="">
                </a>
                <a href="../characters.html" class="side-menu-item">
                    <span>CHARACTERS</span>
                    <img src="../img/raincoat.svg" alt="">
                </a>
                <a href="../houses.html" class="side-menu-item active">
                    <span>HOUSES</span>
                    <img src="../img/house-turret.svg" alt="">
                </a>
            </nav>
            <button class="side-menu-logout" type="button">
                LOGOUT
                <img src="../img/sign-out.svg" alt="">
            </button>
        </aside>
    </main>

    <script src="../js/app.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const houseId = parseInt(params.get("id"));

        const HOUSES_DATA = [
            { id: 1, name: "BLACK BULLS", region: "CLOVER KINGDOM", captain: "YAMI SUKEHIRO" },
            { id: 2, name: "GOLDEN DAWN", region: "CLOVER KINGDOM", captain: "WILLIAM VANGEANCE" },
            { id: 3, name: "SILVER EAGLE", region: "CLOVER KINGDOM", captain: "NOZEL SILVA" },
            { id: 4, name: "BLUE ROSE", region: "CLOVER KINGDOM", captain: "CHARLOTTE ROSELEI" },
            { id: 5, name: "CRIMSON LION", region: "CLOVER KINGDOM", captain: "FUEGOLEON VERMILLION" },
            { id: 6, name: "GREEN MANTIS", region: "CLOVER KINGDOM", captain: "JACK THE RIPPER" },
            { id: 7, name: "CORAL PEACOCK", region: "CLOVER KINGDOM", captain: "DOROTHY UNSWORTH" },
            { id: 8, name: "PURPLE ORC", region: "CLOVER KINGDOM", captain: "RILL BOISMORTIER" },
            { id: 9, name: "AQUA DEER", region: "CLOVER KINGDOM", captain: "GUELDRE POIZOT" },
            { id: 10, name: "DIAMOND KINGDOM", region: "DIAMOND KINGDOM", captain: "MORIS LIBARDIRT" },
            { id: 11, name: "SPADE KINGDOM", region: "SPADE KINGDOM", captain: "DANTE ZOGRATIS" },
            { id: 12, name: "HEART KINGDOM", region: "HEART KINGDOM", captain: "LOLOPECHKA" },
        ];

        const house = HOUSES_DATA.find(h => h.id === houseId);

        if (house) {
            document.getElementById("ehName").textContent = house.name;
            document.getElementById("ehInputName").value = house.name;
            document.getElementById("ehInputRegion").value = house.region;
            document.getElementById("ehInputCaptain").value = house.captain;
        } else {
            document.getElementById("ehName").textContent = "Escuadra no encontrada";
        }

        document.getElementById("ehAvatarInput").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = document.getElementById("ehAvatar");
                img.src = ev.target.result;
                img.style.objectFit = "cover";
                img.style.padding = "0";
                img.style.filter = "none";
            };
            reader.readAsDataURL(file);
        });

        document.getElementById("ehForm").addEventListener("submit", (e) => {
            e.preventDefault();
            Swal.fire({
                title: "¡Cambios guardados!",
                text: `${document.getElementById("ehInputName").value} fue actualizada correctamente.`,
                icon: "success",
                confirmButtonColor: "#3A6FF7",
                background: "#1F1F29",
                color: "#F5F1E8",
                timer: 2000,
                timerProgressBar: true,
                showConfirmButton: false
            }).then(() => history.back());
        });
    </script>
</body>

</html>
