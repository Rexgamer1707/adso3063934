<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Clover - My Profile</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="mobile-stage">
        <section class="profile-view app-view is-active" aria-label="My Profile">

            <button class="menu-trigger profile-menu-trigger" type="button" aria-label="Abrir menu"
                aria-expanded="false">
                <img class="clover-logo" src="img/clover-logo.svg" alt="">
            </button>

            <div class="profile-avatar-wrap">
                <div class="profile-avatar">
                    <img src="img/profile.svg" alt="Avatar">
                </div>
                <button class="profile-edit-btn" type="button">EDIT</button>
            </div>

            <h1 class="profile-title">MY PROFILE</h1>

            <form class="profile-form">
                <div class="profile-field profile-field--disabled">
                    <input id="username" type="text" placeholder="Username" disabled>
                </div>
                <div class="profile-field">
                    <input id="email" type="email" placeholder="Email">
                </div>
                <div class="profile-field">
                    <input id="password" type="password" placeholder="Change Password">
                </div>
                <div class="profile-field">
                    <input id="confirm-password" type="password" placeholder="Confirm Password">
                </div>
                <button class="profile-submit" type="submit">ENTER</button>
            </form>

        </section>

        <button class="menu-backdrop" type="button" aria-label="Cerrar menu"></button>

        <aside class="side-menu side-menu--dashboard" aria-hidden="true">
            <nav class="side-menu-nav side-menu-nav--dashboard" aria-label="Menu principal">
                <a href="dashboard.html" class="side-menu-item">
                    <span>DASHBOARD</span>
                    <img src="img/clover-logo.svg" alt="">
                </a>
                <a href="profile.html" class="side-menu-item active">
                    <span>MY PROFILE</span>
                    <img src="img/profile.svg" alt="">
                </a>
                <a href="characters.html" class="side-menu-item">
                    <span>CHARACTERS</span>
                    <img src="img/raincoat.svg" alt="">
                </a>
                <a href="houses.html" class="side-menu-item">
                    <span>HOUSES</span>
                    <img src="img/house-turret.svg" alt="">
                </a>
            </nav>
            <button class="side-menu-logout" type="button">
                LOGOUT
                <img src="img/sign-out.svg" alt="">
            </button>
        </aside>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
