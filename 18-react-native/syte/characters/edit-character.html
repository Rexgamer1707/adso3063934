<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Clover - Editar Personaje</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <main class="mobile-stage">
        <section class="view-char-view app-view is-active">

            <button class="menu-trigger char-menu-trigger" type="button" aria-label="Abrir menu" aria-expanded="false">
                <img class="clover-logo" src="../img/clover-logo.svg" alt="">
            </button>

            <div class="char-avatar-wrap">
                <div class="char-avatar char-avatar-edit" onclick="document.getElementById('ecAvatarInput').click()">
                    <img id="ecAvatar" src="../img/raincoat.svg" alt="Character">
                </div>
                <input type="file" id="ecAvatarInput" accept="image/*">
            </div>

            <h1 class="char-title" id="ecName">—</h1>

            <form class="ec-form" id="ecForm">
                <div class="ec-field">
                    <label class="ec-label">NAME</label>
                    <input class="ec-input ec-input--disabled" id="ecInputName" type="text" disabled>
                </div>
                <div class="ec-field">
                    <label class="ec-label">MAGIC TYPE</label>
                    <input class="ec-input" id="ecInputMagic" type="text">
                </div>
                <div class="ec-field">
                    <label class="ec-label">RANK</label>
                    <input class="ec-input" id="ecInputRank" type="text">
                </div>

                <div class="ec-actions">
                    <button class="vc-back-btn" type="button" onclick="history.back()">&#8592; BACK</button>
                    <button class="ec-save-btn" type="submit">SAVE ✓</button>
                </div>
            </form>

        </section>

        <button class="menu-backdrop" type="button" aria-label="Cerrar menu"></button>

        <aside class="side-menu side-menu--dashboard" aria-hidden="true">
            <nav class="side-menu-nav side-menu-nav--dashboard" aria-label="Menu principal">
                <a href="../dashboard.html" class="side-menu-item">
                    <span>DASHBOARD</span>
                    <img src="../img/clover-logo.svg" alt="">
                </a>
                <a href="../profile.html" class="side-menu-item">
                    <span>MY PROFILE</span>
                    <img src="../img/profile.svg" alt="">
                </a>
                <a href="../characters.html" class="side-menu-item active">
                    <span>CHARACTERS</span>
                    <img src="../img/raincoat.svg" alt="">
                </a>
                <a href="../houses.html" class="side-menu-item">
                    <span>HOUSES</span>
                    <img src="../img/house-turret.svg" alt="">
                </a>
            </nav>
            <button class="side-menu-logout" type="button">
                LOGOUT
                <img src="../img/sign-out.svg" alt="">
            </button>
        </aside>
    </main>

    <script src="../js/app.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const charId = parseInt(params.get("id"));

        const CHARACTERS_DATA = [
            { id: 1, name: "ASTA", magic: "ANTI MAGIC", rank: "MAGIC KNIGHT" },
            { id: 2, name: "YUNO", magic: "WIND / STAR", rank: "MAGIC KNIGHT" },
            { id: 3, name: "NOELLE SILVA", magic: "WATER", rank: "MAGIC KNIGHT" },
            { id: 4, name: "YAMI SUKEHIRO", magic: "DARK", rank: "CAPTAIN" },
            { id: 5, name: "NACHT FAUST", magic: "SHADOW", rank: "VICE-CAPTAIN" },
            { id: 6, name: "NERO", magic: "SEALING", rank: "MAGIC KNIGHT" },
            { id: 7, name: "VANESSA ENOTECA", magic: "RED THREAD", rank: "MAGIC KNIGHT" },
            { id: 8, name: "LUCK VOLTIA", magic: "LIGHTNING", rank: "MAGIC KNIGHT" },
            { id: 9, name: "MAGNA SWING", magic: "FIRE", rank: "MAGIC KNIGHT" },
            { id: 10, name: "CHARMY PAPPITSON", magic: "COTTON / FOOD", rank: "MAGIC KNIGHT" },
            { id: 11, name: "FINRAL ROULACASE", magic: "SPATIAL", rank: "MAGIC KNIGHT" },
            { id: 12, name: "GAUCHE ADLAI", magic: "MIRROR", rank: "MAGIC KNIGHT" },
            { id: 13, name: "GREY", magic: "TRANSMUTATION", rank: "MAGIC KNIGHT" },
            { id: 14, name: "GORDON AGRIPPA", magic: "POISON CURSE", rank: "MAGIC KNIGHT" },
            { id: 15, name: "MIMOSA VERMILLION", magic: "PLANT", rank: "MAGIC KNIGHT" },
            { id: 16, name: "LEOPOLD VERMILLION", magic: "FIRE", rank: "MAGIC KNIGHT" },
            { id: 17, name: "FUEGOLEON VERMILLION", magic: "FIRE", rank: "CAPTAIN" },
            { id: 18, name: "MEREOLEONA VERMILLION", magic: "FIRE", rank: "CAPTAIN" },
            { id: 19, name: "CHARLOTTE ROSELEI", magic: "BRIAR", rank: "CAPTAIN" },
            { id: 20, name: "NOZEL SILVA", magic: "MERCURY", rank: "CAPTAIN" },
            { id: 21, name: "JULIUS NOVACHRONO", magic: "TIME", rank: "WIZARD KING" },
            { id: 22, name: "ZORA IDEALE", magic: "ASH / TRAP", rank: "MAGIC KNIGHT" },
            { id: 23, name: "HENRY LEGOLANT", magic: "RECOMBINATION", rank: "MAGIC KNIGHT" },
            { id: 24, name: "LIEBE", magic: "ANTI MAGIC", rank: "DEVIL" },
            { id: 25, name: "DANTE ZOGRATIS", magic: "BODY / GRAVITY", rank: "DARK TRIAD" },
            { id: 26, name: "VANICA ZOGRATIS", magic: "BLOOD", rank: "DARK TRIAD" },
            { id: 27, name: "ZENON ZOGRATIS", magic: "BONE / SPATIAL", rank: "DARK TRIAD" },
            { id: 28, name: "LOLOPECHKA", magic: "WATER", rank: "PRINCESS" },
            { id: 29, name: "RILL BOISMORTIER", magic: "PAINTING", rank: "CAPTAIN" },
            { id: 30, name: "DOROTHY UNSWORTH", magic: "DREAM", rank: "CAPTAIN" },
            { id: 31, name: "JACK THE RIPPER", magic: "SLASH", rank: "CAPTAIN" },
            { id: 32, name: "LANGRIS VAUDE", magic: "SPATIAL", rank: "VICE-CAPTAIN" },
            { id: 33, name: "WILLIAM VANGEANCE", magic: "WORLD TREE", rank: "CAPTAIN" },
            { id: 34, name: "PATRI", magic: "LIGHT", rank: "LEADER" },
            { id: 35, name: "LADROS", magic: "MANA ABSORB", rank: "DIAMOND MAGE" },
            { id: 36, name: "MARS", magic: "CRYSTAL / FIRE", rank: "DIAMOND MAGE" },
            { id: 37, name: "FANA", magic: "FIRE / HEALING", rank: "APOSTLE" },
            { id: 38, name: "VETTO", magic: "BEAST", rank: "APOSTLE" },
            { id: 39, name: "LICHT", magic: "SWORD / LIGHT", rank: "LEADER" },
            { id: 40, name: "HENRY SWALLOWTAIL", magic: "RECOMBINATION", rank: "MAGIC KNIGHT" },
        ];

        const character = CHARACTERS_DATA.find(c => c.id === charId);

        if (character) {
            document.getElementById("ecName").textContent = character.name;
            document.getElementById("ecInputName").value = character.name;
            document.getElementById("ecInputMagic").value = character.magic;
            document.getElementById("ecInputRank").value = character.rank;

            const avatarImg = document.getElementById("ecAvatar");
            fetch(`https://api.jikan.moe/v4/characters?q=${encodeURIComponent(character.name)}&limit=1`)
                .then(r => r.json())
                .then(data => {
                    const img = data?.data?.[0]?.images?.jpg?.image_url;
                    if (img) {
                        avatarImg.src = img;
                        avatarImg.style.objectFit = "cover";
                        avatarImg.style.padding = "0";
                    }
                })
                .catch(() => { });
        } else {
            document.getElementById("ecName").textContent = "Personaje no encontrado";
        }

        document.getElementById("ecForm").addEventListener("submit", (e) => {
            e.preventDefault();
            Swal.fire({
                title: "¡Cambios guardados!",
                text: `${document.getElementById("ecInputName").value} fue actualizado correctamente.`,
                icon: "success",
                confirmButtonText: "OK",
                confirmButtonColor: "#3A6FF7",
                background: "#1F1F29",
                color: "#F5F1E8",
                timer: 2000,
                timerProgressBar: true,
                showConfirmButton: false
            }).then(() => {
                history.back();
            });
        });

        document.getElementById("ecAvatarInput").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const avatarImg = document.getElementById("ecAvatar");
                avatarImg.src = ev.target.result;
                avatarImg.style.objectFit = "cover";
                avatarImg.style.padding = "0";
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>

</html>
